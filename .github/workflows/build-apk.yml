name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Memberi tahu GitHub Actions bahwa semua perintah dijalankan di dalam folder vpn-phase1
    defaults:
      run:
        working-directory: ./vpn-phase1

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        # Path upload artifact harus ditulis lengkap dari root repository
        path: vpn-phase1/app/build/outputs/apk/debug/app-debug.apk
